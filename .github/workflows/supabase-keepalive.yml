# Free Supabase projects pause after 7 days without activity.
# This reads one blog post every 3 days so the database stays awake.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query blog_posts
        run: |
          set -a; . ./.env; set +a
          curl --fail -s -o /dev/null \
            "$VITE_SUPABASE_URL/rest/v1/blog_posts?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY"
